# ByteTrack for the duel: same as Ultralytics' bytetrack.yaml, but lost players are kept for 60 tracker frames
# (4 s when the pose model runs on every 2nd camera frame) so a short occlusion does not create a new id.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.8
fuse_score: True
